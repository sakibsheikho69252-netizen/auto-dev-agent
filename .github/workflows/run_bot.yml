name: Run AI Python Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘণ্টা পর পর ব্যাকগ্রাউন্ডে স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch:        # ম্যানুয়ালি ক্লিক করে চালানোর জন্য

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install PyGithub requests

      - name: Execute Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python bot.py
